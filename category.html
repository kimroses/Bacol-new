<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>

<!-- Mencegah Browser HP Menyimpan Cache -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>bacoltv</title>
<meta name="description" content="bacoltv — Free video streaming"/>
<meta name="theme-color" content="#0a0e17"/>
<link rel="icon" type="image/png" href="https://i.ibb.co.com/5xvnqQjj/1000165671.png"/>

<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0e17;
  --card:#131a2b;
  --border:rgba(255,255,255,0.08);
  --text:#f1f5f9;
  --text2:#8b95a7;
  --accent:#3b82f6;
  --gutter:16px;
  --wrap-max:520px;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:var(--wrap-max);margin:0 auto;min-height:100vh;position:relative;}

@media (min-width:700px){ 
  :root{--wrap-max:760px;--gutter:20px;} 
  #cat-grid{grid-template-columns:repeat(4,1fr) !important;} 
}
@media (min-width:1000px){ 
  :root{--wrap-max:1040px;} 
  #cat-grid{grid-template-columns:repeat(5,1fr) !important;} 
}

#site-header{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:calc(var(--wrap-max) - 20px);height:48px;background:rgba(10,14,23,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;z-index:60;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 10px 28px rgba(0,0,0,0.4);}
.hdr-back{background:none;border:none;color:var(--text);opacity:0.85;cursor:pointer;display:flex;padding:4px;text-decoration:none;flex-shrink:0;}
.logo-text{font-size:15px;font-weight:900;letter-spacing:0.06em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.page-body{padding:70px var(--gutter) 40px;}

/* ── UNIVERSAL GRID RESET (Memaksa semua output JS rapi) ── */
#cat-grid {
  display: grid !important;
  grid-template-columns: repeat(3, 1fr) !important;
  gap: 10px !important;
  align-items: start !important;
  width: 100% !important;
}

/* Memaksa SETIAP CARD di dalam grid berukuran persis sama */
#cat-grid > * {
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  text-decoration: none !important;
  color: var(--text) !important;
  min-width: 0 !important;
  overflow: hidden !important;
}

/* Memaksa PEMBUNGKUS GAMBAR terkunci di rasio 2:3 */
#cat-grid > * > div:first-child,
#cat-grid .poster-thumb,
#cat-grid [class*="thumb"] {
  width: 100% !important;
  height: 0 !important;
  padding-bottom: 145% !important; /* Mengunci rasio kotak memanjang */
  position: relative !important;
  overflow: hidden !important;
  border-radius: 10px !important;
  background: var(--card) !important;
  border: 1px solid var(--border) !important;
  flex-shrink: 0 !important;
}

/* Memaksa SEMUA GAMBAR terpotong rapi di tengah (Crop) tanpa merusak rasio */
#cat-grid img {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important; /* Trik kunci agar gambar tidak gepeng/melar */
  border-radius: 10px !important;
  display: block !important;
}

/* Memaksa TULISAN JUDUL rata 2 baris untuk semua item */
#cat-grid > * p,
#cat-grid > * span,
#cat-grid .poster-title,
#cat-grid [class*="title"] {
  margin-top: 6px !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  line-height: 1.3 !important;
  height: 28.6px !important;
  display: -webkit-box !important;
  -webkit-line-clamp: 2 !important;
  -webkit-box-orient: vertical !important;
  overflow: hidden !important;
  color: var(--text) !important;
  opacity: 0.92 !important;
}

.cat-empty{grid-column:1/-1;text-align:center;padding:60px 0;font-size:12px;color:var(--text2);opacity:0.7;}
</style>
</head>
<body>

<div class="wrap">
  <header id="site-header">
    <a class="hdr-back" href="/" aria-label="Back to home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="logo-text" id="cat-heading">Kategori</span>
  </header>

  <div class="page-body">
    <div id="cat-grid"></div>
  </div>
</div>

</body>
</html>
