<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>bacoltv</title>
<meta name="description" content="bacoltv — Free video streaming"/>
<meta name="theme-color" content="#0a0e17"/>
<link rel="icon" type="image/png" href="https://i.ibb.co.com/5xvnqQjj/1000165671.png"/>
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0e17;
  --card:#131a2b;
  --border:rgba(255,255,255,0.08);
  --text:#f1f5f9;
  --text2:#8b95a7;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --gutter:16px;
  --wrap-max:520px;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:var(--wrap-max);margin:0 auto;min-height:100vh;position:relative;}

@media (min-width:700px){ 
  :root{--wrap-max:760px;--gutter:20px;} 
  .co-grid{grid-template-columns:repeat(4,1fr);} 
}
@media (min-width:1000px){ 
  :root{--wrap-max:1040px;} 
  .co-grid{grid-template-columns:repeat(5,1fr);} 
}

#site-header{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:calc(var(--wrap-max) - 20px);height:48px;background:rgba(10,14,23,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;z-index:60;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 10px 28px rgba(0,0,0,0.4);}
.hdr-back{background:none;border:none;color:var(--text);opacity:0.85;cursor:pointer;display:flex;padding:4px;text-decoration:none;flex-shrink:0;}
.logo-text{font-size:15px;font-weight:900;letter-spacing:0.06em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.page-body{padding:70px var(--gutter) 40px;}
.cat-title{font-size:18px;font-weight:900;letter-spacing:0.02em;text-transform:uppercase;margin-bottom:16px;}

/* ── GRID SYSTEM ── */
.co-grid{
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  align-items:stretch;
}

/* Proteksi jika ada elemen iklan disuntikkan ke dalam grid */
.co-grid .ad-slot,
.co-grid [id^="container-"] {
  grid-column: 1 / -1 !important;
  width: 100% !important;
}

/* ── POSTER CARD (DIPROTEKSI DARI SKRIP IKLAN) ── */
.poster {
  text-decoration:none;
  color:var(--text);
  display:flex !important;
  flex-direction:column !important;
  height:100% !important;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
}

.poster-thumb {
  width:100% !important;
  aspect-ratio:2/3 !important;
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
  flex-shrink:0 !important;
}

.poster-thumb .pbg {
  position:absolute !important;
  inset:0 !important;
  background-size:cover;
  background-position:center;
  filter:blur(14px) brightness(0.5);
  transform:scale(1.15);
}

/* Mengunci ukuran gambar agar tidak dirusak skrip iklan */
.poster-thumb img {
  position:absolute !important;
  top:0 !important;
  left:0 !important;
  width:100% !important;
  height:100% !important;
  max-width:100% !important;
  max-height:100% !important;
  object-fit:cover !important;
  display:block !important;
  z-index:1 !important;
}

.poster-title {
  margin-top:7px;
  font-size:11px;
  font-weight:700;
  line-height:1.3;
  height:28.6px;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  opacity:0.92;
  flex-grow:1;
}

.cat-empty{grid-column:1/-1;text-align:center;padding:60px 0;font-size:12px;color:var(--text2);opacity:0.7;}
</style>
</head>
<body>

<div class="wrap">
  <header id="site-header">
    <a class="hdr-back" href="/" aria-label="Back to home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="logo-text" id="cat-heading">Kategori</span>
  </header>

  <div class="page-body">
    <!-- Diisi server-side oleh functions/category/[slug].js -->
    <div class="co-grid" id="cat-grid"></div>
  </div>
</div>

</body>
</html>
