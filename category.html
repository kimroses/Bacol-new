<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>bacoltv</title>
<meta name="description" content="bacoltv — Free video streaming"/>
<meta name="theme-color" content="#0a0e17"/>
<link rel="icon" type="image/png" href="https://i.ibb.co.com/5xvnqQjj/1000165671.png"/>
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0e17;
  --card:#131a2b;
  --border:rgba(255,255,255,0.08);
  --text:#f1f5f9;
  --text2:#8b95a7;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --gutter:16px;
  --wrap-max:520px;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:var(--wrap-max);margin:0 auto;min-height:100vh;position:relative;}
@media (min-width:700px){ :root{--wrap-max:760px;--gutter:20px;} .co-grid{grid-template-columns:repeat(4,1fr);} }
@media (min-width:1000px){ :root{--wrap-max:1040px;} .co-grid{grid-template-columns:repeat(5,1fr);} }

#site-header{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:calc(var(--wrap-max) - 20px);height:48px;background:rgba(10,14,23,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;z-index:60;display:flex;align-items:center;gap:10px;padding:0 14px;box-shadow:0 10px 28px rgba(0,0,0,0.4);}
.hdr-back{background:none;border:none;color:var(--text);opacity:0.85;cursor:pointer;display:flex;padding:4px;text-decoration:none;flex-shrink:0;}
.logo-text{font-size:15px;font-weight:900;letter-spacing:0.06em;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.page-body{padding:70px var(--gutter) 40px;}
.cat-title{font-size:18px;font-weight:900;letter-spacing:0.02em;text-transform:uppercase;margin-bottom:16px;}

.ad-slot{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:16px;border-radius:10px;}
.ad-slot.adblock-hidden{display:none!important;}

.subcat-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;margin-bottom:4px;scrollbar-width:none;}
.subcat-row::-webkit-scrollbar{display:none;}
.subcat-chip{flex-shrink:0;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:7px 14px;font-size:11px;font-weight:700;color:var(--text);text-decoration:none;white-space:nowrap;}

.co-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.poster{text-decoration:none;color:var(--text);display:block;cursor:pointer;-webkit-user-select:none;user-select:none;}
.poster-thumb{width:100%;aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;background:var(--card);border:1px solid var(--border);}
.poster-thumb .pbg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(14px) brightness(0.5);transform:scale(1.15);}
.poster-thumb img{position:relative;z-index:1;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity 0.3s;}
.poster-thumb img.loaded,.poster-thumb img{opacity:1;}
.poster-title{margin-top:7px;font-size:11px;font-weight:700;line-height:1.3;min-height:28.6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;opacity:0.92;}
.cat-empty{grid-column:1/-1;text-align:center;padding:60px 0;font-size:12px;color:var(--text2);opacity:0.7;}

.ad-sticky-bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:9999;width:320px;max-width:100vw;min-height:50px;padding-top:16px;}
.ad-sticky-bottom.hidden{display:none;}
.ad-sticky-close{position:absolute;top:0;right:0;width:18px;height:18px;line-height:18px;text-align:center;font-size:10px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;z-index:1;}
body.has-sticky-ad .page-body{padding-bottom:90px;}
</style>
</head>
<body>

<div class="wrap">
  <header id="site-header">
    <a class="hdr-back" href="/" aria-label="Back to home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <span class="logo-text" id="cat-heading">Kategori</span>
  </header>

  <div class="page-body">
    <!-- AD SLOT ATAS -->
    <div class="ad-slot" id="ad-slot-top"></div>

    <!-- Diisi server-side oleh functions/category/[slug].js (real <a href> links, bukan JS-only) -->
    <div class="co-grid" id="cat-grid"></div>

    <!-- AD SLOT BAWAH -->
    <div class="ad-slot" id="ad-slot-bottom" style="margin-top:16px;"></div>
  </div>
</div>

<div class="ad-sticky-bottom hidden" id="ad-sticky-bottom">
  <button class="ad-sticky-close" id="ad-sticky-close" aria-label="Tutup iklan">✕</button>
  <div id="ad-banner-320x50"></div>
</div>

<script>
// ── ADSTERRA (unit sama dg homepage/watch, cuma dipasang di posisi berbeda) ──
var DIRECT_LINK = 'https://dependedunmoved.com/kxj7zggez?key=487c4246633f81e8f222ab17585a39c3';
var STICKY_BANNER_KEY        = '065169dd18b734cf3df238a49c4742b8';
var STICKY_BANNER_INVOKE_SRC = 'https://dependedunmoved.com/065169dd18b734cf3df238a49c4742b8/invoke.js';
var INFEED_BANNER_KEY        = 'f2701651bae3f6be5c99a063dd518de6';
var INFEED_BANNER_INVOKE_SRC = 'https://dependedunmoved.com/f2701651bae3f6be5c99a063dd518de6/invoke.js';
var NATIVE_BANNER_CONTAINER_ID = 'container-64954bb968b905e75f67b30e072ec5e2';
var NATIVE_BANNER_SCRIPT_SRC   = 'https://dependedunmoved.com/64954bb968b905e75f67b30e072ec5e2/invoke.js';

var adLoadQueue = [];
var adLoadBusy = false;
function queueDirectBannerAd(key, invokeSrc, width, height, mountEl) {
  adLoadQueue.push({ key: key, src: invokeSrc, width: width, height: height, mount: mountEl });
  processAdLoadQueue();
}
function processAdLoadQueue() {
  if (adLoadBusy || !adLoadQueue.length) return;
  adLoadBusy = true;
  var job = adLoadQueue.shift();
  var s1 = document.createElement('script');
  s1.text = "atOptions = {'key':'" + job.key + "','format':'iframe','height':" + job.height + ",'width':" + job.width + ",'params':{}};";
  job.mount.appendChild(s1);
  var s2 = document.createElement('script');
  s2.src = job.src;
  s2.onload = s2.onerror = function() { adLoadBusy = false; processAdLoadQueue(); };
  job.mount.appendChild(s2);
}

queueDirectBannerAd(INFEED_BANNER_KEY, INFEED_BANNER_INVOKE_SRC, 468, 60, document.getElementById('ad-slot-top'));

(function() {
  var mount = document.getElementById('ad-slot-bottom');
  var box = document.createElement('div');
  box.id = NATIVE_BANNER_CONTAINER_ID;
  mount.appendChild(box);
  var s = document.createElement('script');
  s.async = true;
  s.setAttribute('data-cfasync', 'false');
  s.src = NATIVE_BANNER_SCRIPT_SRC;
  box.appendChild(s);
})();

(function() {
  queueDirectBannerAd(STICKY_BANNER_KEY, STICKY_BANNER_INVOKE_SRC, 320, 50, document.getElementById('ad-banner-320x50'));
  document.body.classList.add('has-sticky-ad');
  document.getElementById('ad-sticky-bottom').classList.remove('hidden');
})();
document.getElementById('ad-sticky-close').addEventListener('click', function() {
  window.open(DIRECT_LINK, '_blank');
  document.getElementById('ad-sticky-bottom').classList.add('hidden');
  document.body.classList.remove('has-sticky-ad');
});
</script>
</body>
</html>
