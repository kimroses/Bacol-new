<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>

<!-- Mencegah Browser HP Menyimpan Cache -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />

<title>Kategori Halaman</title>
<meta name="description" content="onlyflix — Free video streaming"/>
<meta name="theme-color" content="#141414"/>
<link rel="icon" type="image/png" href="https://i.ibb.co.com/KjJTJ0pC/1000167963.png"/>

<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#141414;
  --card:#1f1f1f;
  --border:rgba(255,255,255,0.08);
  --text:#f1f5f9;
  --text2:#8b95a7;
  --accent:#E50914;
  --gutter:16px;
  --wrap-max:520px;
  --hdr-top:8px;
  --hdr-side:10px;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;margin:0 auto;min-height:100vh;position:relative;}

/* ── GLOBAL HEADER (Konsisten dengan index.html) ── */
#site-header{position:fixed;top:var(--hdr-top);left:50%;transform:translateX(-50%);width:calc(100% - 2*var(--hdr-side));max-width:calc(var(--wrap-max) - 2*var(--hdr-side));height:48px;background:var(--bg);border:1px solid var(--border);border-radius:14px;z-index:500;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 10px 28px rgba(0,0,0,0.4);}

/* Bagian tengah header dinamis */
#header-center {position:absolute;left:50%;transform:translateX(-50%);cursor:pointer;display:flex;align-items:center;justify-content:center;height:100%;text-decoration:none;}
#header-center .logo{position:relative;left:auto;transform:none;display:flex;align-items:center;gap:8px;text-decoration:none;pointer-events:none;}
.logo-icon{height:20px;width:auto;display:flex;align-items:center;}
.logo-icon img{height:100%;width:auto;object-fit:contain;display:block;}
.logo-text{font-size:15px;font-weight:900;letter-spacing:0.06em;color:var(--text);}
.header-title{font-size:14px;font-weight:800;letter-spacing:0.04em;text-transform:uppercase;color:var(--text);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;text-align:center;}

.hdr-btn{position:relative;background:none;border:none;color:var(--text);opacity:0.85;cursor:pointer;display:flex;padding:4px;text-decoration:none;flex-shrink:0;}
.hdr-badge{position:absolute;top:-3px;right:-4px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:#ef4444;color:#fff;font-size:9px;font-weight:800;display:none;align-items:center;justify-content:center;line-height:1;border:1.5px solid var(--bg);}

.page-body{padding:70px var(--gutter) 40px;}

/* ── SCROLL TO TOP ── */
.scroll-top-btn{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(12px);z-index:90;width:34px;height:34px;border-radius:50%;background:rgba(31,31,31,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--border);color:var(--accent);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,0.35);opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s,bottom 0.2s;}
.scroll-top-btn.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0);}

/* ── AD SLOTS (JuicyAds) — hanya wrapper posisi. UKURAN TIDAK DIKUNCI:
   width/height mengikuti kode ads apa adanya. ── */
.ad-slot{position:fixed;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;}
.ad-slot.hidden{display:none;}
.ad-top-sticky{top:calc(var(--hdr-top) + 48px + 8px);}
.ad-bottom-sticky{bottom:8px;}
.ad-slot-code{display:flex;justify-content:center;}
/* Tombol close ditaruh SEBAGAI BARIS TERPISAH DI ATAS banner (bukan menimpa/menutupi banner) */
.ad-close{cursor:pointer;height:13px;width:auto;display:block;}

/* ── UNIVERSAL GRID RESET (Default HP: 3 Kolom) ── */
/* .bo-grid (overlay bookmark) memakai style yang persis sama dengan #cat-grid */
#cat-grid, .bo-grid {
  display: grid !important;
  grid-template-columns: repeat(3, 1fr) !important;
  gap: 10px !important;
  align-items: start !important;
  width: 100% !important;
  max-width: var(--wrap-max) !important; /* Tambahan baru */
  margin: 0 auto !important; /* Tambahan baru untuk menengahkan grid */
}

/* Memaksa SETIAP CARD di dalam grid berukuran persis sama */
#cat-grid > *, .bo-grid > * {
  display: flex !important;
  flex-direction: column !important;
  width: 100% !important;
  text-decoration: none !important;
  color: var(--text) !important;
  min-width: 0 !important;
  overflow: hidden !important;
}

/* Memaksa PEMBUNGKUS GAMBAR terkunci di rasio 2:3 */
#cat-grid > * > div:first-child,
#cat-grid .poster-thumb,
#cat-grid [class*="thumb"],
.bo-grid .poster-thumb {
  width: 100% !important;
  aspect-ratio: 2/3 !important; 
  height: auto !important; 
  padding-bottom: 0 !important; 
  position: relative !important;
  overflow: hidden !important;
  border-radius: 10px !important;
  background: var(--card) !important;
  border: 1px solid var(--border) !important;
  flex-shrink: 0 !important;
}

.poster-bookmark{position:absolute;top:6px;left:6px;z-index:6;width:24px;height:24px;border-radius:7px;background:rgba(5,8,16,0.8);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;}
.poster-bookmark.active{color:var(--accent);border-color:var(--accent);}

/* Placeholder sebelum thumbnail muncul — SAMA dengan index.html/watch.html:
   gradient merah-tint + ikon play, fade ke gambar asli begitu selesai load. */
.poster-thumb .pph{position:absolute;inset:0;z-index:0;background:linear-gradient(135deg,rgba(229,9,20,0.14),rgba(31,31,31,0.5));}

/* Memaksa SEMUA GAMBAR terpotong rapi di tengah (Crop) tanpa merusak rasio */
#cat-grid img, 
.bo-grid img {
  position: absolute !important;
  top: 0 !important;
  left: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important;
  border-radius: 10px !important;
  display: block !important;
  z-index: 1 !important;
  opacity: 0;
  transition: opacity 0.3s;
}

#cat-grid img.loaded,
.bo-grid img.loaded{opacity:1;}

/* Memaksa TULISAN JUDUL rata 2 baris untuk semua item */
#cat-grid > * p,
#cat-grid > * span,
#cat-grid .poster-title,
#cat-grid [class*="title"],
.bo-grid .poster-title {
  margin-top: 6px !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  line-height: 1.3 !important;
  height: 28.6px !important;
  display: -webkit-box !important;
  -webkit-line-clamp: 2 !important;
  -webkit-box-orient: vertical !important;
  overflow: hidden !important;
  color: var(--text) !important;
  opacity: 0.92 !important;
}

.cat-empty, .bo-empty{grid-column:1/-1;text-align:center;padding:60px 0;font-size:12px;color:var(--text2);opacity:0.7;}

/* ── BOOKMARK OVERLAY (lokal, tanpa pindah halaman) ── */
#bookmark-overlay{position:fixed;inset:0;z-index:450;background:var(--bg);display:none;flex-direction:column;}
#bookmark-overlay.show{display:flex;}
.bo-body{flex:1;overflow-y:auto;padding:70px var(--gutter) 40px;}

/* ── MEDIA QUERIES (disamakan dengan watch.html: 5→6→7 kolom, #cat-grid & .bo-grid naik bareng) ── */
@media (min-width:700px){ 
  :root{--wrap-max:760px;--gutter:20px;} 
  #cat-grid, .bo-grid{grid-template-columns:repeat(5,1fr) !important;} 
}
@media (min-width:1000px){ 
  :root{--wrap-max:1040px;--gutter:24px;} 
  #cat-grid, .bo-grid{grid-template-columns:repeat(6,1fr) !important;} 
}
@media (min-width:1320px){ 
  :root{--wrap-max:1280px;--gutter:28px;}
  #cat-grid, .bo-grid{grid-template-columns:repeat(7,1fr) !important;} 
}
</style>
</head>
<body>

<div class="wrap">
  <!-- HEADER HOMEPAGE KLONINGAN -->
  <header id="site-header">
    <button class="hdr-btn" id="back-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    
    <!-- Link area tengah berfungsi sbg tombol Back ke Beranda (atau tutup overlay bookmark bila lagi kebuka) -->
    <a id="header-center" href="/" aria-label="Back to Home">
      <div class="logo" id="header-logo" style="display:none;">
        <div class="logo-icon"><img src="https://i.ibb.co.com/KjJTJ0pC/1000167963.png" alt="Logo"></div>
      </div>
      <!-- Logo disembunyikan, Title Kategori ditampilkan -->
      <span class="header-title" id="header-title">LOADING...</span>
    </a>
    
    <button class="hdr-btn" id="cat-nav-bookmark" aria-label="Tersimpan">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
      <span class="hdr-badge" id="cat-nav-bookmark-badge">0</span>
    </button>
  </header>

  <!-- AD: STICKY TOP (ukuran mengikuti kode ads, tombol close di BAWAH banner) -->
  <div class="ad-slot ad-top-sticky" id="ad-top-sticky">
    <div class="ad-slot-code">
<!-- JuicyAds v3.0 -->
<script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>
<ins id="1124734" data-width="300" data-height="100"></ins>

  <img class="ad-close" id="ad-bottom-sticky-close" src="https://i.ibb.co.com/d0h5fyC1/1000169357.webp" alt="Tutup iklan">

<script type="text/javascript" data-cfasync="false" async src="https://poweredby.jads.co/js/jads.js"></script>
<ins id="1124776" data-width="300" data-height="50"></ins>
<script type="text/javascript" data-cfasync="false" async>(adsbyjuicy = window.adsbyjuicy || []).push({'adzone':1124776});</script>

<!-- BOOKMARK OVERLAY -->
<div id="bookmark-overlay">
  <div class="bo-body">
    <div class="bo-grid" id="bo-grid"></div>
  </div>
</div>

<script>
var THUMB_HOST = 'https://xpvid.cc';
var FALLBACK_THUMB = 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=500&auto=format&fit=crop';

function resolveThumb(t) {
  if (!t) return FALLBACK_THUMB;
  if (t.indexOf('/') === 0) return THUMB_HOST + t;
  return t;
}
function slugify(text) {
  return String(text || '').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').replace(/-{2,}/g, '-') || 'video';
}
function watchHref(v) { return '/watch/' + slugify(v.title) + '-' + v.id; }

// ── SET JUDUL HEADER DARI TAG <TITLE> ──
// PENTING: dijalankan LANGSUNG (bukan di dalam DOMContentLoaded) karena script
// ini sudah ada di posisi paling bawah <body> — DOM pasti sudah siap saat baris
// ini dieksekusi. Ini WAJIB jalan SEBELUM `headerCenterOriginalHTML` di-snapshot
// di bawah, supaya snapshot itu berisi judul kategori yang benar, bukan
// "LOADING..." bawaan HTML. (BUG LAMA: sebelumnya ini dibungkus dalam
// document.addEventListener("DOMContentLoaded", ...) yang baru jalan NANTI —
// jadi snapshot sempat kepakai duluan dengan teks "LOADING..." yang basi,
// dan itu yang muncul balik ke header begitu overlay bookmark ditutup.)
(function setHeaderTitleFromDocumentTitle() {
  var rawTitle = document.title || "Kategori";
  var cleanTitle = rawTitle.split('-')[0].trim();
  document.getElementById('header-title').textContent = cleanTitle;
})();

// ── TOMBOL BACK ──
document.getElementById('back-btn').onclick = function(e) {
  e.preventDefault(); // Mencegah perilaku default HTML
  history.back();     // Murni memanggil riwayat mundur (sama seperti swipe HP)
};


// Enhancement layer client-side: menambahkan tombol bookmark ke card yang sudah di-render
// server-side (HTMLRewriter), plus overlay "My Bookmarks" lokal di header.
// Tidak menyentuh markup/link asli #cat-grid, jadi SEO tetap aman.
(function(){
  var BOOKMARK_KEY = 'bt_bookmarks'; 

  function getBookmarks(){ try { return JSON.parse(localStorage.getItem(BOOKMARK_KEY)) || []; } catch(e){ return []; } }
  function saveBookmarks(list){ try { localStorage.setItem(BOOKMARK_KEY, JSON.stringify(list)); } catch(e){} }
  function isBookmarked(id){ return getBookmarks().some(function(b){ return String(b.id) === String(id); }); }
  function toggleBookmark(v){
    var list = getBookmarks(); var idx = -1;
    for (var i = 0; i < list.length; i++) { if (String(list[i].id) === String(v.id)) { idx = i; break; } }
    var nowBookmarked;
    if (idx > -1) { list.splice(idx, 1); nowBookmarked = false; }
    else { list.unshift({ id: v.id, title: v.title, thumbnail: v.thumbnail }); nowBookmarked = true; }
    saveBookmarks(list); return nowBookmarked;
  }

  // Ambil id video dari href "/watch/judul-slug-{id}" (segmen terakhir setelah hyphen)
  function extractIdFromHref(href) {
    try {
      var path = href.replace(/^https?:\/\/[^\/]+/, '').split('?')[0].split('#')[0];
      var seg = path.split('/').filter(Boolean).pop() || '';
      var parts = seg.split('-');
      return parts[parts.length - 1] || null;
    } catch (e) { return null; }
  }

  function addBookmarkButtons() {
    var cards = document.querySelectorAll('#cat-grid > a');
    cards.forEach(function(card) {
      if (card.querySelector('.poster-bookmark')) return; // sudah pernah disisipkan
      var href = card.getAttribute('href');
      if (!href) return;
      var id = extractIdFromHref(href);
      if (!id) return;

      var thumb = card.querySelector('.poster-thumb') || card.querySelector('[class*="thumb"]') || card.firstElementChild;
      if (!thumb) return;

      var img = card.querySelector('img');
      var titleEl = card.querySelector('.poster-title') || card.querySelector('[class*="title"]') || card.querySelector('p') || card.querySelector('span');
      var title = titleEl ? titleEl.textContent.trim() : (img ? img.alt : '');
      var thumbnail = img ? img.getAttribute('src') : '';

      var bm = document.createElement('button');
      bm.type = 'button';
      bm.className = 'poster-bookmark' + (isBookmarked(id) ? ' active' : '');
      bm.setAttribute('aria-label', 'Bookmark');
      bm.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
      bm.onclick = function(e) {
        e.preventDefault(); e.stopPropagation();
        var nowBookmarked = toggleBookmark({ id: id, title: title, thumbnail: thumbnail });
        bm.classList.toggle('active', nowBookmarked);
        updateHeaderBadge();
      };
      thumb.appendChild(bm);
    });
  }

  // update badge jumlah bookmark di ikon header
  function updateHeaderBadge() {
    var n = getBookmarks().length;
    var badge = document.getElementById('cat-nav-bookmark-badge');
    if (badge) {
      if (n > 0) {
        badge.textContent = n > 9 ? '9+' : String(n); 
        badge.style.display = 'flex';
      } else {
        badge.style.display = 'none';
      }
    }
  }

  // ── BOOKMARK OVERLAY (lokal, tanpa pindah halaman) ──
  var headerCenter = document.getElementById('header-center');
  // Snapshot ini diambil DI SINI (setelah setHeaderTitleFromDocumentTitle() di atas
  // sudah selesai jalan), jadi isinya sudah pasti judul kategori yang benar.
  var headerCenterOriginalHTML = headerCenter.innerHTML;
  var bookmarkOverlay = document.getElementById('bookmark-overlay');
  var boGrid = document.getElementById('bo-grid');
  var isBookmarkOverlayOpen = false;

  function makeBookmarkPoster(v) {
    var title = v.title || 'Untitled';
    var el = document.createElement('a');
    el.className = 'poster';
    el.href = watchHref(v);
    var th = document.createElement('div');
    th.className = 'poster-thumb';
    var ph = document.createElement('div');
    ph.className = 'pph';
    th.appendChild(ph);
    var img = document.createElement('img');
    img.alt = title; img.loading = 'lazy'; img.decoding = 'async';
    img.onload = function() { this.classList.add('loaded'); };
    img.onerror = function() { this.style.display = 'none'; };
    img.src = resolveThumb(v.thumbnail);
    th.appendChild(img);
    var bm = document.createElement('button');
    bm.type = 'button';
    bm.className = 'poster-bookmark active';
    bm.setAttribute('aria-label', 'Bookmark');
    bm.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>';
    bm.onclick = function(e) {
      e.preventDefault(); e.stopPropagation();
      toggleBookmark(v);
      updateHeaderBadge();
      renderBookmarkGrid();
    };
    th.appendChild(bm);
    var t = document.createElement('div');
    t.className = 'poster-title';
    t.textContent = title;
    el.appendChild(th);
    el.appendChild(t);
    return el;
  }

  function renderBookmarkGrid() {
    var list = getBookmarks();
    boGrid.innerHTML = '';
    if (!list.length) {
      boGrid.innerHTML = '<div class="bo-empty">Belum ada bookmark</div>';
      return;
    }
    var frag = document.createDocumentFragment();
    list.forEach(function(v) { frag.appendChild(makeBookmarkPoster(v)); });
    boGrid.appendChild(frag);
  }

  function openBookmarkOverlay() {
    renderBookmarkGrid();
    headerCenter.innerHTML = '<span class="header-title">MY BOOKMARKS</span>';
    bookmarkOverlay.classList.add('show');
    isBookmarkOverlayOpen = true;
    history.pushState({ overlay: 'bookmark' }, '', '');
  }

  function closeBookmarkOverlay() {
    bookmarkOverlay.classList.remove('show');
    headerCenter.innerHTML = headerCenterOriginalHTML;
    isBookmarkOverlayOpen = false;
  }

  document.getElementById('cat-nav-bookmark').onclick = openBookmarkOverlay;

  headerCenter.addEventListener('click', function(e) {
    if (isBookmarkOverlayOpen) {
      e.preventDefault();
      history.back();
    }
  });

  window.addEventListener('popstate', function() {
    if (isBookmarkOverlayOpen) closeBookmarkOverlay();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      addBookmarkButtons();
      updateHeaderBadge();
    });
  } else {
    addBookmarkButtons();
    updateHeaderBadge();
  }
})();

// ── AD SLOTS: close (X) buka direct link lalu sembunyikan banner, hanya untuk sesi ini ──
var AD_DIRECT_LINK = 'https://dependedunmoved.com/iakcem4gf?key=46bd07e3392cad07ff14bcda337ad3fe';
var adBottomSticky = document.getElementById('ad-bottom-sticky');
function closeAdSlot(slotEl) {
  window.open(AD_DIRECT_LINK, '_blank');
  slotEl.classList.add('hidden');
  updateScrollTopOffset();
}
document.getElementById('ad-top-sticky-close').onclick = function() {
  closeAdSlot(document.getElementById('ad-top-sticky'));
};
document.getElementById('ad-bottom-sticky-close').onclick = function() {
  closeAdSlot(adBottomSticky);
};

// ── SCROLL TO TOP ── tombol (^) otomatis duduk di atas banner sticky footer,
// tinggi dibaca langsung dari offsetHeight elemen ad (bukan angka tetap), jadi
// otomatis menyesuaikan berapa pun ukuran banner yang dipasang ke depannya.
var scrollTopCat = document.getElementById('scroll-top-cat');
window.addEventListener('scroll', function() { scrollTopCat.classList.toggle('show', window.scrollY > 400); }, { passive: true });
scrollTopCat.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };

function updateScrollTopOffset() {
  var adVisible = adBottomSticky && !adBottomSticky.classList.contains('hidden');
  if (adVisible) {
    var gap = 10, bottomOffset = 8;
    scrollTopCat.style.bottom = (bottomOffset + adBottomSticky.offsetHeight + gap) + 'px';
  } else {
    scrollTopCat.style.bottom = '16px';
  }
}
if (window.ResizeObserver && adBottomSticky) {
  new ResizeObserver(updateScrollTopOffset).observe(adBottomSticky);
} else {
  window.addEventListener('resize', updateScrollTopOffset);
}
updateScrollTopOffset();
</script>

</body>
</html>
