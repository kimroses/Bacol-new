<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>BACOLTV - Watch</title>
<meta name="description" content="BACOLTV — Free video streaming"/>
<meta name="theme-color" content="#0a0e17"/>
<link rel="icon" type="image/png" href="https://i.ibb.co.com/5xvnqQjj/1000165671.png"/>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0e17;
  --bg2:#0d1220;
  --card:#131a2b;
  --card-hover:#1a243a;
  --border:rgba(255,255,255,0.08);
  --text:#f1f5f9;
  --text2:#8b95a7;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --gutter:16px;
  --wrap-max:680px;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{
  width:100%;
  max-width:var(--wrap-max);
  margin:0 auto;
  min-height:100vh;
  position:relative;
}

@media (min-width:700px){ 
  :root{--wrap-max:840px;--gutter:24px;} 
  .related-grid{grid-template-columns:repeat(4, 1fr) !important;}
}
@media (min-width:1000px){ 
  :root{--wrap-max:1040px;} 
  .related-grid{grid-template-columns:repeat(5, 1fr) !important;}
}

/* ── HEADER MODERN ── */
#site-header{
  position:fixed;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:calc(var(--wrap-max) - 24px);
  height:50px;
  background:rgba(10,14,23,0.85);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);
  border-radius:14px;
  z-index:60;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  box-shadow:0 12px 32px rgba(0,0,0,0.5);
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:26px;height:26px;}
.logo-icon img{width:100%;height:100%;object-fit:contain;}
.logo-text{font-size:16px;font-weight:900;letter-spacing:0.06em;color:var(--text);}
.hdr-back{
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  width:32px;
  height:32px;
  text-decoration:none;
  transition:background 0.2s;
}
.hdr-back:hover{background:rgba(255,255,255,0.1);}

.page-body{padding:80px var(--gutter) 40px;}

/* ── PLAYER CARD & INFO CONTAINER MODERN ── */
.player-card{
  width:100%;
  background:var(--card);
  border-radius:16px;
  overflow:hidden;
  border:1px solid var(--border);
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
}

.player-box{
  width:100%;
  aspect-ratio:16/9;
  background:#000;
  position:relative;
}
.player-box video{
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  background:#000;
}

/* Loader */
.pm-loader{
  position:absolute;
  inset:0;
  background:#000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  opacity:1;
  visibility:visible;
  transition:opacity 0.2s,visibility 0.2s;
  z-index:5;
}
.pm-loader:not(.show){opacity:0;visibility:hidden;}
.pm-loader .spinner{
  width:32px;
  height:32px;
  border:3px solid rgba(59,130,246,0.2);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin 0.7s linear infinite;
}
.pm-loader span{
  font-size:11px;
  color:var(--text2);
  font-weight:600;
  text-align:center;
  padding:0 24px;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Details & Metadata Below Video */
.player-details{
  padding:16px 18px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.video-title-main{
  font-size:16px;
  font-weight:800;
  line-height:1.4;
  color:#fff;
  letter-spacing:-0.01em;
}

.meta-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-wrap:wrap;
  gap:10px;
}

.meta-left{
  display:flex;
  align-items:center;
  gap:10px;
}

.view-badge{
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:700;
  color:var(--text2);
}
.view-badge svg{color:#facc15;}

.quality-badge{
  display:inline-flex;
  align-items:center;
  background:rgba(59,130,246,0.15);
  border:1px solid rgba(59,130,246,0.3);
  color:var(--accent2);
  padding:4px 8px;
  border-radius:6px;
  font-size:10px;
  font-weight:800;
  letter-spacing:0.05em;
}

.pm-note-box{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 12px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  border-radius:10px;
  color:var(--text2);
}
.pm-note-box svg{flex-shrink:0;color:var(--accent2);}
.pm-note-box span{font-size:11px;line-height:1.4;}

/* ── SECTION RELATED / RANDOM VIDEOS (SERAGAM & FIXED) ── */
.related-section { margin-top:28px; }
.related-head {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}
.related-bar {
  width:4px;
  height:16px;
  background:var(--accent);
  border-radius:4px;
}
.related-title {
  font-size:14px;
  font-weight:800;
  letter-spacing:0.04em;
  text-transform:uppercase;
  color:var(--text);
}

/* Grid layout dengan ukuran poster fixed */
.related-grid {
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:12px;
}

.poster-card {
  display:flex;
  flex-direction:column;
  text-decoration:none;
  color:inherit;
  width:100%;
}

.poster-thumb {
  width:100%;
  aspect-ratio:2/3; /* Mengunci rasio poster agar selalu seragam */
  border-radius:10px;
  overflow:hidden;
  position:relative;
  background:var(--card);
  border:1px solid var(--border);
}
.poster-thumb img {
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover; /* Gambar dipotong presisi tanpa distorsi */
  display:block;
  opacity:0;
  transition:opacity 0.3s, transform 0.3s;
}
.poster-card:hover .poster-thumb img {
  transform:scale(1.05);
}
.poster-thumb img.loaded { opacity:1; }

.poster-ph {
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg, rgba(59,130,246,0.1), rgba(19,26,43,0.6));
}

.poster-title {
  margin-top:8px;
  font-size:11px;
  font-weight:700;
  line-height:1.35;
  color:var(--text);
  /* Lock max 2 baris agar tinggi kartu selalu persis sama */
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
  height:29.7px;
}

/* Home Button */
.watch-more-btn{
  margin-top:24px;
  padding:14px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-decoration:none;
  color:var(--text);
  transition:background 0.2s;
}
.watch-more-btn:hover{ background:var(--card-hover); }
.watch-more-btn span{ font-size:13px; font-weight:700; }
.watch-more-btn svg{ color:var(--accent2); flex-shrink:0; }
</style>
</head>
<body>

<div class="wrap">
  <header id="site-header">
    <a class="hdr-back" href="/" aria-label="Back to home">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <div class="logo">
      <div class="logo-icon"><img src="https://i.ibb.co.com/5xvnqQjj/1000165671.png" alt="Logo"></div>
      <span class="logo-text">BACOLTV</span>
    </div>
    <div style="width:32px;"></div>
  </header>

  <div class="page-body">
    <!-- MAIN PLAYER & DETAIL BOX -->
    <div class="player-card">
      <div class="player-box">
        <video id="main-player" playsinline controls></video>
        <div class="pm-loader show" id="player-loader">
          <div class="spinner"></div>
          <span>Memuat video... Jika buffering terus coba reload halaman</span>
        </div>
      </div>
      
      <div class="player-details">
        <h1 class="video-title-main" id="video-title">Loading...</h1>
        
        <div class="meta-row">
          <div class="meta-left">
            <div class="view-badge">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="12,2 15,9 22,9.5 16.5,14.5 18.5,22 12,17.8 5.5,22 7.5,14.5 2,9.5 9,9"/></svg>
              <span id="view-count">0</span> views
            </div>
            <div class="quality-badge">AUTO HD</div>
          </div>
        </div>

        <div class="pm-note-box">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="8.01"/><line x1="12" y1="11" x2="12" y2="16"/></svg>
          <span>Jika video <b>ERROR</b> atau tidak bisa diputar, coba aktifkan <b>VPN</b> atau reload halaman.</span>
        </div>
      </div>
    </div>

    <!-- RELATED / RANDOM VIDEOS -->
    <section class="related-section">
      <div class="related-head">
        <div class="related-bar"></div>
        <h2 class="related-title">Video Lainnya / Random</h2>
      </div>
      <div class="related-grid" id="related-grid">
        <!-- Diisi otomatis oleh JavaScript -->
      </div>
    </section>

    <a class="watch-more-btn" href="/">
      <span>Kembali & Cari video lain di BACOLTV</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
    </a>
  </div>
</div>

<script>
// ── CONFIG BACKEND WORKERS BACOLTV ──
var API = 'https://vidoy-x.zalpro.workers.dev';
var PROXY_WORKER = 'https://proxy-vidoy.zalpro.workers.dev';
var API_KEY = 'hQwtIQTI22dJubmGhkKl';
var ROOT_FOLDER = 'rxk071a6llo';
var THUMB_HOST  = 'https://xpvid.cc';
var FALLBACK_THUMB = 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=500&auto=format&fit=crop';

function resolveThumb(v) {
  var t = v.thumbnail;
  if (!t) return FALLBACK_THUMB;
  if (t.indexOf('/') === 0) return THUMB_HOST + t;
  return t;
}

function slugify(text) {
  return String(text || '')
    .toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-{2,}/g, '-') || 'video';
}
function watchHref(v) { return '/watch/' + slugify(v.title) + '-' + v.id; }

// ── PLAYER & METADATA ──
var videoEl = document.getElementById('main-player');
var playerLoader = document.getElementById('player-loader');

videoEl.addEventListener('canplay', function() { playerLoader.classList.remove('show'); });
videoEl.addEventListener('loadeddata', function() { playerLoader.classList.remove('show'); });
videoEl.addEventListener('playing', function() { playerLoader.classList.remove('show'); });

var hlsInstance = null;
var currentViews = Math.floor(Math.random() * 53000 + 13000);
document.getElementById('view-count').textContent = currentViews.toLocaleString('id-ID');

function setTitle(text) { document.getElementById('video-title').textContent = text; }

// Render Poster Card dengan ukuran yang terkunci
function makePoster(v) {
  var title = v.title || 'Untitled';
  var thumb = resolveThumb(v);

  var card = document.createElement('a');
  card.className = 'poster-card';
  card.href = watchHref(v);

  var thumbContainer = document.createElement('div');
  thumbContainer.className = 'poster-thumb';

  var placeholder = document.createElement('div');
  placeholder.className = 'poster-ph';
  placeholder.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><polygon points="9,7 9,17 19,12" fill="rgba(59,130,246,0.6)"/></svg>';
  thumbContainer.appendChild(placeholder);

  var img = document.createElement('img');
  img.alt = title; 
  img.loading = 'lazy';
  img.decoding = 'async';
  img.onload = function() { this.classList.add('loaded'); placeholder.style.display = 'none'; };
  img.onerror = function() { this.style.display = 'none'; };
  img.src = thumb;
  thumbContainer.appendChild(img);

  var titleEl = document.createElement('div');
  titleEl.className = 'poster-title';
  titleEl.textContent = title;

  card.appendChild(thumbContainer);
  card.appendChild(titleEl);
  return card;
}

// Fetch & Render Related/Random Videos dari API Folder
function loadRelatedVideos(currentVideoId) {
  fetch(API + '/folder/' + ROOT_FOLDER, { headers: { 'X-API-Key': API_KEY } })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json || json.status !== 'success') return;
      var subfolders = json.data.subfolders || [];
      var masterVideos = json.data.videos || [];

      var subfetches = subfolders.map(function(fld) {
        return fetch(API + '/folder/' + fld.id, { headers: { 'X-API-Key': API_KEY } })
          .then(function(res) { return res.json(); })
          .then(function(subJson) {
            return (subJson && subJson.status === 'success') ? (subJson.data.videos || []) : [];
          }).catch(function() { return []; });
      });

      Promise.all(subfetches).then(function(results) {
        results.forEach(function(vids) { masterVideos = masterVideos.concat(vids); });
        
        // Keluarkan video yang sedang diputar
        var filtered = masterVideos.filter(function(v) { return String(v.id) !== String(currentVideoId); });
        
        // Acak urutan video
        filtered.sort(function() { return 0.5 - Math.random(); });
        var recommendations = filtered.slice(0, 15); // Ambil 15 item

        var gridEl = document.getElementById('related-grid');
        gridEl.innerHTML = '';
        var frag = document.createDocumentFragment();
        recommendations.forEach(function(v) {
          frag.appendChild(makePoster(v));
        });
        gridEl.appendChild(frag);
      });
    }).catch(function() {});
}

// Fetch Video Source & Init HLS
function loadVideo(id, fallbackTitle) {
  playerLoader.classList.add('show');
  setTitle(fallbackTitle || 'Loading...');

  fetch(API + '/video/' + id, { headers: { 'X-API-Key': API_KEY } })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (json.status !== 'success') {
        setTitle('Error loading video');
        playerLoader.classList.remove('show');
        return;
      }
      var rawUrl = json.data.direct_url;
      if (!rawUrl) {
        setTitle('Error: Direct Link tidak ditemukan');
        playerLoader.classList.remove('show');
        return;
      }
      setTitle(json.data.title || fallbackTitle || 'Untitled');

      var proxiedUrl = PROXY_WORKER + '/' + rawUrl;
      if (hlsInstance) hlsInstance.destroy();
      var isHls = (json.data.format === 'hls') || (!json.data.format && rawUrl.includes('.m3u8'));

      if (isHls) {
        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(proxiedUrl);
          hlsInstance.attachMedia(videoEl);
          hlsInstance.on(Hls.Events.ERROR, function(e, data) {
            if (data.fatal) playerLoader.classList.remove('show');
          });
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
          videoEl.src = proxiedUrl;
        }
      } else {
        videoEl.src = proxiedUrl;
      }

      // Load rekomendasi video setelah data utama siap
      loadRelatedVideos(id);
    })
    .catch(function() {
      setTitle('Network Server Error');
      playerLoader.classList.remove('show');
    });
}

// Inisialisasi Halaman
var initial = window.__VIDEO_INITIAL__;
if (initial && initial.id) {
  loadVideo(initial.id, initial.title);
} else {
  var m = location.pathname.match(/^\/watch\/([^\/?#]+)/);
  var slug = m ? decodeURIComponent(m[1]) : null;
  var id = slug ? slug.split('-').pop() : null;
  if (id) loadVideo(id);
  else setTitle('Video not found');
}
</script>
</body>
</html>
