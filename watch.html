<html lang="id">
<head>
<meta charset="UTF-8"/>

<style>
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0e17;
  --bg2:#0d1220;
  --card:#131a2b;
  --border:rgba(255,255,255,0.08);
  --text:#f1f5f9;
  --text2:#8b95a7;
  --accent:#3b82f6;
  --accent2:#60a5fa;
  --gutter:16px;
  --wrap-max:520px;
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:var(--wrap-max);margin:0 auto;min-height:100vh;position:relative;}
@media (min-width:700px){ 
  :root{--wrap-max:640px;--gutter:20px;} 
  .related-grid{grid-template-columns:repeat(4, minmax(0, 1fr)) !important;}
}
@media (min-width:1000px){ 
  :root{--wrap-max:760px;} 
  .related-grid{grid-template-columns:repeat(5, minmax(0, 1fr)) !important;}
}

/* ── HEADER ORIGINAL ── */
#site-header{position:fixed;top:8px;left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:calc(var(--wrap-max) - 20px);height:48px;background:rgba(10,14,23,0.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:14px;z-index:60;display:flex;align-items:center;justify-content:space-between;padding:0 14px;box-shadow:0 10px 28px rgba(0,0,0,0.4);}
.logo{display:flex;align-items:center;gap:8px;}
.logo-icon{width:24px;height:24px;}
.logo-icon img{width:100%;height:100%;object-fit:contain;}
.logo-text{font-size:15px;font-weight:900;letter-spacing:0.06em;color:var(--text);}
.hdr-back{background:none;border:none;color:var(--text);opacity:0.85;cursor:pointer;display:flex;padding:4px;text-decoration:none;}

.page-body{padding:70px var(--gutter) 40px;}

/* AD SLOT */
.ad-slot{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:14px;border-radius:10px;}
.ad-slot.adblock-hidden{display:none!important;}

/* ── PLAYER CARD ORIGINAL ── */
.pm-card{width:100%;background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--border);box-shadow:0 25px 70px rgba(0,0,0,0.55);}
.pm-top{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:rgba(0,0,0,0.3);gap:6px;}
.pm-title{font-size:13px;font-weight:800;color:#fff;flex:1;margin:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pm-views{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text2);font-weight:700;flex-shrink:0;}
.pm-player{width:100%;aspect-ratio:16/9;background:#000;position:relative;}
.pm-player video{width:100%;height:100%;display:block;object-fit:contain;background:#000;}
.pm-loader{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;opacity:1;visibility:visible;transition:opacity 0.2s,visibility 0.2s;z-index:5;}
.pm-loader:not(.show){opacity:0;visibility:hidden;}
.pm-loader .spinner{width:26px;height:26px;border:3px solid rgba(59,130,246,0.2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
.pm-loader span{font-size:10px;color:var(--accent2);font-weight:700;text-align:center;padding:0 24px;}
@keyframes spin{to{transform:rotate(360deg)}}
.ad-direct-overlay{position:absolute;inset:0;z-index:4;cursor:pointer;}
.ad-direct-overlay.hidden{display:none;}
.antiadblock-overlay{position:absolute;inset:0;z-index:8;background:rgba(0,0,0,0.94);display:none;align-items:center;justify-content:center;padding:20px;text-align:center;}
.antiadblock-overlay.show{display:flex;}
.antiadblock-icon{width:34px;height:34px;color:var(--accent2);margin-bottom:10px;}
.antiadblock-title{color:#fff;font-size:14px;font-weight:800;margin-bottom:6px;}
.antiadblock-desc{color:var(--text2);font-size:11px;line-height:1.5;}
.pm-note{display:flex;align-items:center;gap:6px;margin:12px 14px 14px;padding:8px 10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:8px;color:var(--text2);}
.pm-note svg{flex-shrink:0;color:var(--accent2);}
.pm-note span{font-size:11px;line-height:1.3;}

/* ── RELATED / RANDOM VIDEOS (PERBAIKAN LAYOUT PERMANEN) ── */
.related-section { margin-top:20px; }
.related-head { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
.related-bar { width:4px; height:14px; background:var(--accent); border-radius:2px; flex-shrink:0; }
.related-title { font-size:12px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; color:var(--text); }

/* Grid Kunci Ukuran: minmax(0, 1fr) mencegah kolom mekar sendiri */
.related-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 10px;
  width: 100%;
}

.poster {
  display: flex !important;
  flex-direction: column !important;
  text-decoration: none !important;
  color: inherit !important;
  width: 100% !important;
  min-width: 0 !important; /* Mencegah overflow teks merusak lebar kartu */
}

.poster-thumb {
  width: 100% !important;
  aspect-ratio: 2 / 3 !important; /* Kunci rasio gambar seragam */
  border-radius: 10px;
  overflow: hidden;
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.poster-thumb img {
  position: absolute !important;
  inset: 0 !important;
  width: 100% !important;
  height: 100% !important;
  object-fit: cover !important; /* Mencegah gambar gepeng / beda ukuran */
  display: block !important;
  opacity: 0;
  transition: opacity 0.3s;
}
.poster-thumb img.loaded { opacity: 1; }

.poster-thumb .pph {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.03);
}

.poster-title-sub {
  margin-top: 6px !important;
  font-size: 11px !important;
  font-weight: 700 !important;
  line-height: 1.3 !important;
  height: 28.6px !important; /* Kunci tinggi persis 2 baris teks */
  display: -webkit-box !important;
  -webkit-line-clamp: 2 !important;
  -webkit-box-orient: vertical !important;
  overflow: hidden !important;
  text-overflow: ellipsis !important;
  word-break: break-word;
  opacity: 0.92;
}

.watch-more{margin-top:16px;padding:14px;background:var(--card);border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:var(--text);}
.watch-more span{font-size:12px;font-weight:700;}
.watch-more svg{color:var(--accent2);flex-shrink:0;}

/* AD 3: sticky bottom 320x50 */
.ad-sticky-bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);z-index:9999;width:320px;max-width:100vw;min-height:50px;padding-top:16px;}
.ad-sticky-bottom.hidden{display:none;}
.ad-sticky-close{position:absolute;top:0;right:0;width:18px;height:18px;line-height:18px;text-align:center;font-size:10px;font-weight:700;background:var(--accent);color:#fff;border:none;border-radius:4px;cursor:pointer;z-index:1;}
body.has-sticky-ad .page-body{padding-bottom:100px;}
</style>
</head>

<script>
// ── CONFIG BACKEND BACOLTV ──
var API = 'https://vidoy-x.zalpro.workers.dev';
var PROXY_WORKER = 'https://proxy-vidoy.zalpro.workers.dev';
var API_KEY = 'hQwtIQTI22dJubmGhkKl';
var ROOT_FOLDER = 'rxk071a6llo';
var THUMB_HOST  = 'https://xpvid.cc';
var FALLBACK_THUMB = 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=500&auto=format&fit=crop';

var DIRECT_LINK = 'https://dependedunmoved.com/kxj7zggez?key=487c4246633f81e8f222ab17585a39c3';
var STICKY_BANNER_KEY        = '065169dd18b734cf3df238a49c4742b8';
var STICKY_BANNER_INVOKE_SRC = 'https://dependedunmoved.com/065169dd18b734cf3df238a49c4742b8/invoke.js';
var INFEED_BANNER_KEY        = 'f2701651bae3f6be5c99a063dd518de6';
var INFEED_BANNER_INVOKE_SRC = 'https://dependedunmoved.com/f2701651bae3f6be5c99a063dd518de6/invoke.js';
var NATIVE_BANNER_CONTAINER_ID = 'container-64954bb968b905e75f67b30e072ec5e2';
var NATIVE_BANNER_SCRIPT_SRC   = 'https://dependedunmoved.com/64954bb968b905e75f67b30e072ec5e2/invoke.js';

function resolveThumb(v) {
  var t = v.thumbnail;
  if (!t) return FALLBACK_THUMB;
  if (t.indexOf('/') === 0) return THUMB_HOST + t;
  return t;
}

function slugify(text) {
  return String(text || '')
    .toLowerCase()
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .replace(/-{2,}/g, '-') || 'video';
}
function watchHref(v) { return '/watch/' + slugify(v.title) + '-' + v.id; }

// ── MANAJEMEN IKLAN BANNER ──
var adLoadQueue = [];
var adLoadBusy = false;
function queueDirectBannerAd(key, invokeSrc, width, height, mountEl) {
  adLoadQueue.push({ key: key, src: invokeSrc, width: width, height: height, mount: mountEl });
  processAdLoadQueue();
}
function processAdLoadQueue() {
  if (adLoadBusy || !adLoadQueue.length) return;
  adLoadBusy = true;
  var job = adLoadQueue.shift();
  var s1 = document.createElement('script');
  s1.text = "atOptions = {'key':'" + job.key + "','format':'iframe','height':" + job.height + ",'width':" + job.width + ",'params':{}};";
  job.mount.appendChild(s1);
  var s2 = document.createElement('script');
  s2.src = job.src;
  s2.onload = s2.onerror = function() { adLoadBusy = false; processAdLoadQueue(); };
  job.mount.appendChild(s2);
}

queueDirectBannerAd(INFEED_BANNER_KEY, INFEED_BANNER_INVOKE_SRC, 468, 60, document.getElementById('ad-slot-top'));

(function() {
  var mount = document.getElementById('ad-slot-bottom');
  var box = document.createElement('div');
  box.id = NATIVE_BANNER_CONTAINER_ID;
  mount.appendChild(box);
  var s = document.createElement('script');
  s.async = true;
  s.setAttribute('data-cfasync', 'false');
  s.src = NATIVE_BANNER_SCRIPT_SRC;
  box.appendChild(s);
})();

(function() {
  queueDirectBannerAd(STICKY_BANNER_KEY, STICKY_BANNER_INVOKE_SRC, 320, 50, document.getElementById('ad-banner-320x50'));
  document.body.classList.add('has-sticky-ad');
  document.getElementById('ad-sticky-bottom').classList.remove('hidden');
})();
document.getElementById('ad-sticky-close').addEventListener('click', function() {
  window.open(DIRECT_LINK, '_blank');
  document.getElementById('ad-sticky-bottom').classList.add('hidden');
  document.body.classList.remove('has-sticky-ad');
});

var adDirectOverlay = document.getElementById('ad-direct-overlay');
adDirectOverlay.addEventListener('click', function() {
  window.open(DIRECT_LINK, '_blank');
  adDirectOverlay.classList.add('hidden');
});

// ── PLAYER ──
var videoEl = document.getElementById('main-player');
var playerLoader = document.getElementById('player-loader');
videoEl.addEventListener('canplay', function() { playerLoader.classList.remove('show'); });
videoEl.addEventListener('loadeddata', function() { playerLoader.classList.remove('show'); });
videoEl.addEventListener('playing', function() { playerLoader.classList.remove('show'); });

var hlsInstance = null;
var currentViews = Math.floor(Math.random() * 53000 + 13000);
document.getElementById('view-count').textContent = currentViews.toLocaleString('id-ID');

function setTitle(text) { document.getElementById('video-title').textContent = text; }

// Render Poster Related (Fixed Lock)
function makePoster(v) {
  var title = v.title || 'Untitled';
  var thumb = resolveThumb(v);

  var el = document.createElement('a');
  el.className = 'poster';
  el.href = watchHref(v);

  var th = document.createElement('div');
  th.className = 'poster-thumb';

  var ph = document.createElement('div');
  ph.className = 'pph';
  ph.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none"><polygon points="9,7 9,17 19,12" fill="rgba(59,130,246,0.6)"/></svg>';
  th.appendChild(ph);

  var img = document.createElement('img');
  img.alt = title; 
  img.loading = 'lazy';
  img.decoding = 'async';
  img.onload = function() { this.classList.add('loaded'); ph.style.display = 'none'; };
  img.onerror = function() { this.style.display = 'none'; };
  img.src = thumb;
  th.appendChild(img);

  var t = document.createElement('div');
  t.className = 'poster-title-sub';
  t.textContent = title;

  el.appendChild(th);
  el.appendChild(t);
  return el;
}

// Fetch Related/Random Videos dari API Folder
function loadRelatedVideos(currentVideoId) {
  fetch(API + '/folder/' + ROOT_FOLDER, { headers: { 'X-API-Key': API_KEY } })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (!json || json.status !== 'success') return;
      var subfolders = json.data.subfolders || [];
      var masterVideos = json.data.videos || [];

      var subfetches = subfolders.map(function(fld) {
        return fetch(API + '/folder/' + fld.id, { headers: { 'X-API-Key': API_KEY } })
          .then(function(res) { return res.json(); })
          .then(function(subJson) {
            return (subJson && subJson.status === 'success') ? (subJson.data.videos || []) : [];
          }).catch(function() { return []; });
      });

      Promise.all(subfetches).then(function(results) {
        results.forEach(function(vids) { masterVideos = masterVideos.concat(vids); });
        
        var filtered = masterVideos.filter(function(v) { return String(v.id) !== String(currentVideoId); });
        filtered.sort(function() { return 0.5 - Math.random(); });
        var recommendations = filtered.slice(0, 12);

        var gridEl = document.getElementById('related-grid');
        gridEl.innerHTML = '';
        var frag = document.createDocumentFragment();
        recommendations.forEach(function(v) {
          frag.appendChild(makePoster(v));
        });
        gridEl.appendChild(frag);
      });
    }).catch(function() {});
}

function loadVideo(id, fallbackTitle) {
  playerLoader.classList.add('show');
  setTitle(fallbackTitle || 'Loading...');
  adDirectOverlay.classList.remove('hidden');

  fetch(API + '/video/' + id, { headers: { 'X-API-Key': API_KEY } })
    .then(function(r) { return r.json(); })
    .then(function(json) {
      if (json.status !== 'success') {
        setTitle('Error loading video');
        playerLoader.classList.remove('show');
        return;
      }
      var rawUrl = json.data.direct_url;
      if (!rawUrl) {
        setTitle('Error: Direct Link tidak ditemukan');
        playerLoader.classList.remove('show');
        return;
      }
      setTitle(json.data.title || fallbackTitle || 'Untitled');

      var proxiedUrl = PROXY_WORKER + '/' + rawUrl;
      if (hlsInstance) hlsInstance.destroy();
      var isHls = (json.data.format === 'hls') || (!json.data.format && rawUrl.includes('.m3u8'));

      if (isHls) {
        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(proxiedUrl);
          hlsInstance.attachMedia(videoEl);
          hlsInstance.on(Hls.Events.ERROR, function(e, data) {
            if (data.fatal) playerLoader.classList.remove('show');
          });
        } else if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
          videoEl.src = proxiedUrl;
        }
      } else {
        videoEl.src = proxiedUrl;
      }

      loadRelatedVideos(id);
    })
    .catch(function() {
      setTitle('Network Server Error');
      playerLoader.classList.remove('show');
    });
}

var initial = window.__VIDEO_INITIAL__;
if (initial && initial.id) {
  loadVideo(initial.id, initial.title);
} else {
  var m = location.pathname.match(/^\/watch\/([^\/?#]+)/);
  var slug = m ? decodeURIComponent(m[1]) : null;
  var id = slug ? slug.split('-').pop() : null;
  if (id) loadVideo(id);
  else setTitle('Video not found');
}

// ── DETEKSI ADBLOCK ORIGINAL ──
var antiAdblockOverlay = document.getElementById('antiadblock-overlay');

function scriptAdCheck(callback) {
  var done = false;
  var s = document.createElement('script');
  s.src = STICKY_BANNER_INVOKE_SRC;
  s.async = true;
  function finish(blocked) {
    if (done) return;
    done = true;
    if (s.parentNode) s.parentNode.removeChild(s);
    callback(blocked);
  }
  s.onload = function() { finish(false); };
  s.onerror = function() { finish(true); };
  document.body.appendChild(s);
  setTimeout(function() { finish(true); }, 3000);
}

function baitDivCheck(callback) {
  var bait = document.createElement('div');
  bait.className = 'adsbox ad-banner ads adsbygoogle pub_300x250 pub_300x250m pub_728x90 text-ad textAd text_ad text-ads';
  bait.style.cssText = 'width:1px!important;height:1px!important;position:absolute!important;left:-9999px!important;top:-9999px!important;';
  document.body.appendChild(bait);
  setTimeout(function() {
    var blocked = false;
    if (bait.offsetParent === null || bait.offsetHeight === 0 || bait.offsetWidth === 0 || bait.clientHeight === 0) blocked = true;
    var cs = window.getComputedStyle(bait);
    if (cs.display === 'none' || cs.visibility === 'hidden') blocked = true;
    bait.remove();
    callback(blocked);
  }, 100);
}

function detectAdBlock(callback) {
  var pending = 2;
  var anyBlocked = false;
  function done(blocked) {
    if (blocked) anyBlocked = true;
    pending--;
    if (pending === 0) callback(anyBlocked);
  }
  scriptAdCheck(done);
  baitDivCheck(done);
}

var AD_SLOT_SELECTOR = '.ad-slot';
function hideAdSlots() {
  document.querySelectorAll(AD_SLOT_SELECTOR).forEach(function(el) { el.classList.add('adblock-hidden'); });
  document.getElementById('ad-sticky-bottom').classList.add('hidden');
  document.body.classList.remove('has-sticky-ad');
}
function showAdSlots() {
  document.querySelectorAll(AD_SLOT_SELECTOR).forEach(function(el) { el.classList.remove('adblock-hidden'); });
}
function showOverlay() {
  antiAdblockOverlay.classList.add('show');
  if (videoEl && !videoEl.paused) videoEl.pause();
  hideAdSlots();
}
function hideOverlay() {
  antiAdblockOverlay.classList.remove('show');
  showAdSlots();
}

var BLOCK_CONFIRMATIONS_NEEDED = 2;
var CLEAR_CONFIRMATIONS_NEEDED = 2;
var consecutiveBlocked = 0;
var consecutiveClear = 0;
function runCheck() {
  detectAdBlock(function(blocked) {
    if (blocked) {
      consecutiveClear = 0;
      consecutiveBlocked++;
      if (consecutiveBlocked >= BLOCK_CONFIRMATIONS_NEEDED) showOverlay();
    } else {
      consecutiveBlocked = 0;
      consecutiveClear++;
      if (consecutiveClear >= CLEAR_CONFIRMATIONS_NEEDED) hideOverlay();
    }
  });
}
runCheck();
setInterval(runCheck, 4000);
</script>
